name: ci
on: [push, pull_request]
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "${{ matrix.python }}" }
      - run: python -W error::ResourceWarning -m unittest discover -s tests
      - run: python -m driftguard examples/models --no-persist
      - run: python -m driftguard inspect examples/models --json --no-persist
      - run: python -m driftguard parse examples/models --json --no-persist
      - run: python -m driftguard scan tests/security_corpus/positive --fail-on-severity none --no-persist
      - run: python -m driftguard scan tests/security_corpus/negative --no-persist
      - run: python -m driftguard refactor plan examples/models --max-risk suggested --db driftguard-ci.db
      - name: LLM absence contract (exit 2)
        shell: bash
        run: |
          python -m driftguard refactor analyze tests/golden/drift/renamed/models --llm-suggestions --llm-base-url http://127.0.0.1:1 --db driftguard-ci.db
          test $? -eq 2
      - name: Trusted-code plugin seam
        run: python -m driftguard refactor plan examples/models --max-risk suggested --rules-dir examples/plugins --db driftguard-ci.db